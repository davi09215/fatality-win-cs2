name: Compilar Fatality DLL

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Baixar source
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compilar Release x64
      run: msbuild cs2_internal.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Salvar DLL gerada
      uses: actions/upload-artifact@v4
      with:
        name: fatality-cs2-dll
        path: '**/*.dll'
